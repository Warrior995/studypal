name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studypal/package-lock.json

      - name: Install dependencies
        working-directory: studypal
        run: npm ci

      - name: Run tests
        working-directory: studypal
        run: npm test